<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>login page</h1>
    <a href="/">
        <span>home</span>
    </a>
    <a href="../test.html">test</a>
    <form action="../test.html" method="get">
        <input type="text" name="username" id="" placeholder="enter name" required>
        <input type="search" name="serach" id="" placeholder="search..." autocomplete="on">
        <input type="password" name="" id="" placeholder="enter password" autofocus>
        <input type="datetime" name="" id="" placeholder="enter date">
        <input type="email" name="mail" value="aaa@aaa.com" id="" placeholder="enter email">
        <input type="url" name="" id="" placeholder="enter url">
        <br><br>
        <input type="time" name="" id="">
        <input type="date" name="" id="">
        <input type="week" name="" id="">
        <input type="month" name="" id="">
        <br><br>
        <input type="color" name="" id="">
        <input type="range" name="" id="" min="1" max="5">
        <input type="image" src="../assets/images/img1.jpg" style="width: 100px;" alt="">
        <br><br>
        <input type="file" name="" id="">
        <br><br>
        <input type="checkbox" name="sport" id="fb" value="football">
        <label for="fb">football</label>
        <input type="checkbox" name="sport" id="hb" value="handball">
        <label for="hb">handball</label>
        <br>
        <label for="ma">male</label>
        <input type="radio" name="gender" id="ma" value="male">
        <label for="fma">female</label>
        <input type="radio" name="gender" id="fma" value="female">
        <input type="hidden" name="" id="">
        <br><br>
        <textarea name="" id="" cols="20" rows="5" placeholder="type here..."></textarea>
        <br><br>
        <select name="country" id="" multiple>
            <option>chooce country</option>
            <option value="tanta">tanta</option>
            <option value="alex" disabled>alex</option>
            <option value="giza">Giza</option>
            <option value="cairo" selected>Cairo</option>
        </select>
        <br><br>
        <input type="text" list="city" id="" name="city">
        <datalist id="city">
            <option value="cairo">
            <option value="giza">
            <option value="alex">
        </datalist>
        <br><br>
        <input type="reset" value="delete">
        <input type="submit" value="save">
    </form>
</body>
</html>
